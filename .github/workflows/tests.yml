name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pinned Elten test host
        uses: actions/checkout@v7
        with:
          repository: dawidpieper/elten3
          ref: 5142182f40c901284c5d460b649b5c2e3813ccaf
          path: .ci/elten3
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Install translation authoring tools
        run: bundle install --gemfile tools/Gemfile.i18n
      - name: Check compiled translations and generated views
        run: ruby tools/translations.rb check
      - name: Run tests
        env:
          ELTEN_HOST_SOURCE: ${{ github.workspace }}/.ci/elten3
        run: ruby tools/run-tests.rb --report test-results.json
